
{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>INTECAP | Iniciar sesión</title>
    <link rel="stylesheet" href="{% static 'css/login.css' %}">
</head>
<body>

    <main class="login-container">
        <section class="login-card">

            <div class="logo">
                <h1>INTECAP</h1>
                <p>Sistema de Gestión Institucional</p>
            </div>

            <h2>Bienvenido</h2>
            <p class="subtitle">Ingresa tus datos para continuar</p>

            {% if form.errors %}
                <div class="error">
                    Usuario o contraseña incorrectos.
                </div>
            {% endif %}

            <form method="POST">
                {% csrf_token %}

                <label for="id_username">Usuario</label>
                <input
                    type="text"
                    name="username"
                    id="id_username"
                    placeholder="Escribe tu usuario"
                    required
                    autofocus
                >

                <label for="id_password">Contraseña</label>
                <input
                    type="password"
                    name="password"
                    id="id_password"
                    placeholder="Escribe tu contraseña"
                    required
                >

                <button type="submit">Iniciar sesión</button>
            </form>

            <p class="footer">
                INTECAP © 2026 - Sistema Administrativo
            </p>

        </section>
    </main>

</body>
</html>
