{% load static %}

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ titulo }}</title>
    <link rel="stylesheet" href="{% static 'css/alumnos.css' %}">
</head>
<body>

<div class="container">

    <main class="contenido">

        <h1>{{ titulo }}</h1>

        <form method="POST">
            {% csrf_token %}

            {{ form.as_p }}

            <button type="submit">Guardar curso</button>

            <a href="{% url 'curso_lista' %}">Cancelar</a>
        </form>

    </main>

</div>

</body>
</html>
