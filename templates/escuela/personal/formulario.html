{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ titulo }} | INTECAP</title>
    <link rel="stylesheet" href="{% static 'css/alumnos.css' %}">
</head>
<body>

    <main class="content">
        <section class="table-container">

            <h1>{{ titulo }}</h1>
            <p>Completa los datos del personal.</p>

            <form method="POST">
                {% csrf_token %}

                {{ form.as_p }}

                <button type="submit" class="btn-add">
                    Guardar personal
                </button>

                <a href="{% url 'personal_lista' %}">Cancelar</a>
            </form>

        </section>
    </main>

</body>
</html>
