{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eliminar alumno | INTECAP</title>
    <link rel="stylesheet" href="{% static 'css/alumnos.css' %}">
</head>
<body>

    <main class="content">
        <section class="table-container">
            <h1>Eliminar alumno</h1>

            <p>
                ¿Estás seguro de que deseas eliminar a
                <strong>{{ alumno.nombres }} {{ alumno.apellidos }}</strong>?
            </p>

            <form method="POST">
                {% csrf_token %}
                <button type="submit" class="delete">Sí, eliminar</button>
                <a href="{% url 'alumno_lista' %}">Cancelar</a>
            </form>
        </section>
    </main>

</body>
</html>
