{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ titulo }} | INTECAP</title>
    <link rel="stylesheet" href="{% static 'css/alumnos.css' %}">
</head>
<body>

    <main class="content">
        <header>
            <div>
                <h1>{{ titulo }}</h1>
                <p>Completa los datos del alumno.</p>
            </div>
        </header>

        <section class="table-container">
            <form method="POST">
                {% csrf_token %}

                {{ form.as_p }}

                <button type="submit" class="btn-add">Guardar alumno</button>
                <a href="{% url 'alumno_lista' %}">Cancelar</a>
            </form>
        </section>
    </main>

</body>
</html>
